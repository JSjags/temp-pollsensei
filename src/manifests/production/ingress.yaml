apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pollsensei-web-ingress-prod
  namespace: prod-pollsensei-web
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - pollsensei.ai
      secretName: prod-pollsensei-web-tls
  rules:
    - host: pollsensei.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pollsensei-web-service
                port:
                  number: 3000
