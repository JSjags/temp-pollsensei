apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pollsensei-web-monitor
  namespace: production
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: pollsensei-web-app
  namespaceSelector:
    matchNames:
      - production
  endpoints:
    - port: http
      interval: 30s
